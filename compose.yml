services:
  postgres:
    image: postgres:16-alpine
    container_name: fad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fad
      POSTGRES_PASSWORD: fad
      POSTGRES_DB: fad_dev
    ports:
      - "5432:5432"
    volumes:
      - fad-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fad -d fad_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fad-postgres-data:
