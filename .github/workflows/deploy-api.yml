name: Deploy API (Railway)

# Runs the shared CI gate, then uploads the checked-out tree to Railway and
# waits for the deployment to finish.
#
# No migration step here on purpose. `.railway/railway.ts` sets the pre-deploy command
# to `npx prisma migrate deploy`, which Railway runs in a separate container
# after the build and BEFORE the new deployment takes traffic; a non-zero exit
# fails the deploy and the previous revision keeps serving. That is the same
# pre-traffic gate the retired ECS migration RunTask provided, so its removal
# here is deliberate, not an omission.
#
# `railway up` uploads this checkout rather than letting Railway pull from
# GitHub, so the deployed revision is exactly the SHA the CI gate passed. If
# Railway's own GitHub auto-deploy is also enabled on the service, deploys can
# arrive from two paths and the auto-deploy one bypasses this gate — see
# `docs/deployment-railway-cloudflare.md`.

on:
  workflow_dispatch:

concurrency:
  group: deploy-api-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    # Reuse the exact PR gate (build + DB-backed tests) — no copy-paste.
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            common/package-lock.json
            app/package-lock.json

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy to Railway (waits for the pre-deploy migration and health check)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          set -euo pipefail
          railway up --service "${RAILWAY_SERVICE}" --ci
