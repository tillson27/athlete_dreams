name: Deploy Web (Cloudflare Worker)

# Builds the plain static export (no basePath) and deploys the Worker, which
# serves `client/out` as static assets and proxies `/v1/*` to Railway.
#
# There is no cache-invalidation step: Cloudflare versions static assets per
# deployment, so the CloudFront `create-invalidation` this replaces has no
# equivalent and is not needed.

on:
  workflow_dispatch:

concurrency:
  group: deploy-web-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            common/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build common
        run: npm run build --prefix common

      - name: Build static export (no basePath)
        run: npm run build --prefix client
        env:
          STATIC_EXPORT: "true"
          # Data-source flags come from GitHub environment variables so the
          # pipeline preserves the environment's mode. `client/lib/dataSource.ts`
          # treats only the literal `mock` as mock, so an unset variable deploys
          # in `api` mode against NEXT_PUBLIC_API_BASE_URL.
          NEXT_PUBLIC_DATA_SOURCE: ${{ vars.NEXT_PUBLIC_DATA_SOURCE }}
          # Absolute but same-origin: every request goes back through the Worker,
          # which keeps CORS empty and the Stripe webhook host unchanged. Override
          # the variable to the workers.dev URL when deploying a preview.
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://athletearc.ca' }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # API_ORIGIN is the Railway public URL. It defaults to the value in
          # wrangler.jsonc; set the variable to retarget a preview deployment.
          command: >-
            deploy
            ${{ vars.RAILWAY_API_ORIGIN && format('--var API_ORIGIN:{0}', vars.RAILWAY_API_ORIGIN) || '' }}
