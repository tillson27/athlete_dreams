name: Deploy Web (test)

# Builds the plain static export (no basePath) and publishes it to the WebStack
# S3 bucket behind CloudFront, then invalidates the edge cache. The legacy
# GitHub Pages workflow (deploy-client-pages.yml) is intentionally left untouched
# until the DNS cutover (M7). AI authors this; the user owns the AWS side — the
# `test` environment supplies the OIDC role, bucket, and distribution id (see
# cdk/README.md).

on:
  push:
    branches:
      - nate
    paths:
      - client/**
      - common/**
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

concurrency:
  group: deploy-web-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      # Static export target (WebStack). Bucket name is deterministic; the
      # distribution id is CloudFront-generated, so it must be set as a variable.
      WEB_BUCKET: ${{ vars.WEB_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            common/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build common
        run: npm run build --prefix common

      - name: Build static export (no basePath)
        run: npm run build --prefix client
        env:
          STATIC_EXPORT: "true"
          # Data-source flags come from GitHub environment variables so the
          # pipeline preserves the environment's mode (unset -> mock default).
          NEXT_PUBLIC_DATA_SOURCE: ${{ vars.NEXT_PUBLIC_DATA_SOURCE }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync static export to S3
        run: |
          set -euo pipefail
          aws s3 sync client/out/ "s3://${WEB_BUCKET}" --delete

      - name: Invalidate CloudFront cache
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths '/*'
